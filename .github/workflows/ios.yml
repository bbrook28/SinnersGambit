name: iOS TestFlight

# Builds the iPhone app on a GitHub-hosted Mac, signs it with Apple's
# automatic (cloud) signing and uploads it to TestFlight. No Mac needed.
# Run it from the Actions tab ("Run workflow"). Same pipeline as Sumo Scuffle (its docs/IOS.md covers setup).

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "TestFlight What to Test text (empty: leave it)"
        type: string
        default: ""
      table:
        description: "Open on the table layout (export preset \"iOS (table)\", feature table_view; blockout playtests)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: 4.7.2

jobs:
  testflight:
    # Apple requires the iOS 27 SDK for uploads (email to Ben, 2026-11-21). GitHub has Xcode 27 only on its
    # public-preview image xcode-27 (actions/runner-images#14404; macos-26 tops out at Xcode 26.6); it may queue.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check Apple secrets
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The Team ID lives in export_presets.cfg (it isn't secret); an
          # APPLE_TEAM_ID secret, if set, overrides it.
          TEAM="$TEAM_SECRET"
          [ -z "$TEAM" ] && TEAM=$(sed -n 's/^application\/app_store_team_id="\(.*\)"/\1/p' export_presets.cfg | head -1)  # one line per iOS preset
          echo "APPLE_TEAM=$TEAM" >> $GITHUB_ENV
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see Docs/Handoff.md)"
            exit 1
          fi

      - name: Pick Xcode 27 (the newest release, never a beta or RC; fails rather than fall back to an older SDK)
        run: |
          ls -d /Applications/Xcode_*.app
          newest=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -iv "beta\|release_candidate" | sort -V | tail -1)
          if [ -z "$newest" ]; then echo "::error::No Xcode 27 release on this runner image; Apple needs the iOS 27 SDK."; exit 1; fi
          sudo xcode-select -s "$newest"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          case "$sdk" in 27*|28*|29*) ;; *) echo "::error::iOS SDK $sdk is older than 27"; exit 1 ;; esac

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-macos-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          cd ~/godot
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q tpl.tpz && rm tpl.tpz
          mv templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: |
          GODOT=~/godot/Godot.app/Contents/MacOS/Godot
          $GODOT --headless --import || $GODOT --headless --import

      - name: Load check (every script and scene parses and loads)
        run: |
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . --script res://tests/load_check.gd

      - name: Tests (the rules and the screen; a failure stops the build before the export)
        run: |
          GODOT=~/godot/Godot.app/Contents/MacOS/Godot bash tests/run_all.sh

      - name: Set Team ID, version and build number
        env:
          TEAM: ${{ env.APPLE_TEAM }}
        run: |
          # The version is ui/version.gd's VERSION (bumped by hand; CLAUDE.md says when).
          # Every TestFlight upload needs a higher build number: 100 + the run number.
          VERSION=$(sed -n 's/^const VERSION := "\(.*\)"/\1/p' ui/version.gd)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::ui/version.gd has no VERSION (read: '$VERSION')"; exit 1; }
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          COMMIT=$(git rev-parse --short=7 HEAD)
          sed -i '' "s/^application\/app_store_team_id=.*/application\/app_store_team_id=\"$TEAM\"/" export_presets.cfg
          sed -i '' "s/^application\/short_version=.*/application\/short_version=\"$VERSION\"/" export_presets.cfg
          sed -i '' "s/^application\/version=.*/application\/version=\"$BUILD\"/" export_presets.cfg
          sed -i '' "s/^const BUILD := .*/const BUILD := \"$BUILD\"/; s/^const COMMIT := .*/const COMMIT := \"$COMMIT\"/" ui/version.gd
          grep -E '^const (VERSION|BUILD|COMMIT)' ui/version.gd
          grep -q '^const BUILD := "[0-9][0-9]*"' ui/version.gd || { echo "::error::ui/version.gd: BUILD is empty after the stamp"; exit 1; }
          grep -q '^const COMMIT := "[0-9a-f]\{7,\}"' ui/version.gd || { echo "::error::ui/version.gd: COMMIT is empty after the stamp"; exit 1; }
          echo "Version $VERSION, build $BUILD, commit $COMMIT"
          echo "BUILD=$BUILD" >> $GITHUB_ENV

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          PRESET="iOS"
          [ "${{ inputs.table }}" = "true" ] && PRESET="iOS (table)"
          echo "Export preset: $PRESET"
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --export-release "$PRESET" build/ios/SinnersGambit.ipa
          test -d build/ios/SinnersGambit.xcodeproj

      - name: Write App Store Connect key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$KEY" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Archive
        env:
          TEAM: ${{ env.APPLE_TEAM }}
        run: |
          # Build the archive unsigned. Signing it here would need a
          # development profile, which Apple only issues once an iPhone is
          # registered to the team; the upload step below signs it with an
          # App Store profile instead, which needs no devices.
          xcodebuild archive \
            -project build/ios/SinnersGambit.xcodeproj \
            -scheme SinnersGambit \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SinnersGambit.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Upload to TestFlight
        env:
          TEAM: ${{ env.APPLE_TEAM }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SinnersGambit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: TestFlight notes (What to Test)
        if: inputs.notes != ''
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          NOTES: ${{ inputs.notes }}
        run: |
          # Waits for App Store Connect to list the uploaded build, then sets its
          # "What to Test" text (en-US). Internal testing only: nothing is sent
          # for beta or App Store review.
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" -q install pyjwt cryptography requests
          "$RUNNER_TEMP/asc/bin/python" - <<'PY'
          import os, time, jwt, requests
          key = open(os.environ["ASC_KEY_PATH"]).read()
          def token():
              now = int(time.time())
              return jwt.encode({"iss": os.environ["ISSUER"], "iat": now, "exp": now + 1100, "aud": "appstoreconnect-v1"},
                                key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          api = "https://api.appstoreconnect.apple.com/v1"
          def call(method, path, **kw):
              r = requests.request(method, api + path, headers={"Authorization": "Bearer " + token()}, timeout=60, **kw)
              if r.status_code >= 400:
                  raise SystemExit(f"{method} {path}: {r.status_code} {r.text[:500]}")
              return r.json() if r.text else {}
          app = call("GET", "/apps", params={"filter[bundleId]": "com.benbrook.sinnersgambit"})["data"][0]["id"]
          build = None
          for _ in range(90):  # up to 45 min for the build to appear
              found = call("GET", "/builds", params={"filter[app]": app, "filter[version]": os.environ["BUILD"]})["data"]
              if found:
                  build = found[0]["id"]
                  break
              time.sleep(30)
          if not build:
              raise SystemExit("build %s never appeared in App Store Connect" % os.environ["BUILD"])
          locs = call("GET", f"/builds/{build}/betaBuildLocalizations")["data"]
          en = [l for l in locs if l["attributes"]["locale"] == "en-US"]
          if en:
              call("PATCH", f"/betaBuildLocalizations/{en[0]['id']}", json={"data": {"type": "betaBuildLocalizations",
                   "id": en[0]["id"], "attributes": {"whatsNew": os.environ["NOTES"]}}})
          else:
              call("POST", "/betaBuildLocalizations", json={"data": {"type": "betaBuildLocalizations",
                   "attributes": {"locale": "en-US", "whatsNew": os.environ["NOTES"]},
                   "relationships": {"build": {"data": {"type": "builds", "id": build}}}}})
          print("Notes set on build", os.environ["BUILD"])
          PY

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
